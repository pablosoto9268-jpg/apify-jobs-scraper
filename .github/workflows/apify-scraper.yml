name: Extracción Diaria de Vacantes

on:
  schedule:
    # Se ejecuta todos los días a las 14:00 UTC (08:00 AM hora de CDMX)
    - cron: '0 14 * * *'
  workflow_dispatch: # Te permite ejecutarlo manualmente con un botón

jobs:
  buscar_empleos:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v3

    - name: Configurar entorno Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Ejecutar script de JSearch
      env:
        RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      run: node jsearch-jobs.js

    - name: Guardar y subir el archivo de vacantes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add vacantes_jsearch.json
        git commit -m "Actualización automática de vacantes JSearch" || echo "No hay vacantes nuevas para actualizar"
        git push
